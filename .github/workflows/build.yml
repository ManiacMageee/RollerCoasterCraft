name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM and MinGW linker
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev
      - name: Assemble and link
        run: ./build.sh
      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: RollerCoasterCraft-windows
          path: RollerCoasterCraft.exe
